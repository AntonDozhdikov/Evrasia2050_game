<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Turn intelligence and controlled country QA</title></head><body>
<p id="status">WAIT TURN</p><iframe id="game" src="../play_the_game.html" style="width:1100px;height:850px;border:0"></iframe>
<script>
(function(){
 const frame=document.getElementById('game'),status=document.getElementById('status');
 const check=(a,m)=>{if(!a)throw Error(m);};
 frame.addEventListener('load',()=>setTimeout(()=>{
  try{
   const d=frame.contentDocument,w=frame.contentWindow;
   check(!!w.EurasiaTurnIntelligence,'No turn intelligence module');
   check(!!w.EurasiaUnits,'No unit conversion module');
   check(d.getElementById('partyTurnIntelligence').textContent.includes('Первый ход'),'Initial turn context missing');
   check(d.getElementById('partyTurnIntelligence').textContent.includes('2025'),'Year marker missing');
   const blr=d.querySelector('#partyCountries input[value="BLR"]');
   blr.click();
   check(d.querySelectorAll('#partyCountryTabs button').length===2,'Two managed countries not selectable');
   const first=d.querySelector('select[data-party-country="RUS"][data-party-action="0"]');
   first.value='2';first.dispatchEvent(new Event('change',{bubbles:true}));
   d.getElementById('partyNext').click();
   check(Number(d.getElementById('partyYear').value)===2026,'Not on next year');
   const p=d.getElementById('partyTurnIntelligence');
   check(p.textContent.includes('Что сделали государства в 2025 году'),'No past actions');
   check(p.querySelectorAll('.turn-history tbody tr').length===8,'Prior actions of 8 countries missing');
   check(p.textContent.includes('Решение стратегии'),'No AI action source');
   check(p.textContent.includes('Ваше решение'),'No player action source');
   check(p.textContent.includes('Кризисы, предусмотренные сценарием на 2026 год'),'Future crisis calendar not visible');
   check(!p.textContent.includes('Что сделали государства в 2026 году'),'Future AI actions leaked');
   d.getElementById('partyCalculate').click();
   check(!d.getElementById('partyResultsContent').hidden,'Results failed: '+d.getElementById('partyResultsStatus').textContent);
   check(d.querySelectorAll('#partyControlledSummary .controlled-result-card').length===2,'Must compare RUS and BLR individually');
   check(d.querySelectorAll('#partyControlledSummary .controlled-result-metric').length===12,'Must show six national metrics each');
   const select=d.getElementById('partyCountryBaseline');
   select.value='NEUTRAL';select.dispatchEvent(new Event('change',{bubbles:true}));
   check(d.querySelector('#partyControlledSummary').textContent.includes(w.EurasiaModel.policyNames.NEUTRAL),'Country baseline did not change');
   const insight=d.getElementById('partyStrengths').textContent;
   check(!/174\s*268\s*226\s*220/.test(insight),'Unconverted dollar value visible in billion-dollar comparison');
   check(d.getElementById('partyResultRows').textContent.includes('млрд долл.'),'Trade units missing');
   const metrics=d.getElementById('partyCountryMetric');
   check([...metrics.options].length>=11,'Missing expanded country macroeconomic chart selectors');
   metrics.value='unemployment';metrics.dispatchEvent(new Event('change',{bubbles:true}));
   check(d.getElementById('partyCountryDetailChart').textContent.includes('Безработица'),'Country unemployment plot did not update');
   frame.style.width='320px';
   check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+4,'Mobile overflow: '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth);
   status.textContent='PASS TURN QA: prior AI actions, crises, national outcomes, billion-dollar units, strategy selector, 320px';
  }catch(e){status.textContent='FAIL TURN QA: '+e.message;}
 },450),{once:true});
 setTimeout(()=>{if(status.textContent==='WAIT TURN')status.textContent='FAIL TURN QA: timeout';},33000);
})();
</script></body></html>
