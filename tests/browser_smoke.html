<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка браузерной игры</title></head>
<body><p id="status">ОЖИДАНИЕ</p><iframe id="game" src="../play_the_game.html" style="width:1200px;height:880px;border:0"></iframe>
<script>
(function(){
 'use strict';
 const status=document.getElementById('status');
 const frame=document.getElementById('game');
 const verify=()=>{
  try{
   const d=frame.contentDocument,w=frame.contentWindow;
   const expect=(yes,why)=>{if(!yes)throw Error(why)};
   expect(d.getElementById('partyCalculate'),'Кнопка расчета не найдена');
   expect(d.getElementById('partyCountryTabs'),'Нет переключателей стран');
   expect(!d.getElementById('archive-results').open,'Архив открыт сразу');
   expect(!d.getElementById('partyAllMetrics').open,'Таблица показателей открыта сразу');
   expect(!d.querySelector('#text-editor'),'Редактор виден в игре');
   d.getElementById('uxQuickStart').click();
   const belarus=[...d.querySelectorAll('#partyCountries input')].find(x=>x.value==='BLR');
   expect(belarus,'Нет выбора Беларуси');
   const rus=d.querySelector('select[data-party-country="RUS"][data-party-action="0"]');
   rus.value=rus.value==='2'?'0':'2';
   const changedRussia=Number(rus.value);
   rus.dispatchEvent(new Event('change',{bubbles:true}));
   belarus.click();
   let recorded=JSON.parse(w.localStorage.getItem('evrasia2050:party-draft:v1'));
   expect(recorded.years['2025'].RUS[0]===changedRussia,'Изменение России потеряно при добавлении страны');
   const tab=d.querySelector('[data-party-tab="BLR"]');
   expect(tab,'Нет вкладки Беларуси');tab.click();
   const investment=d.querySelector('select[data-party-country="BLR"][data-party-action="1"]');
   expect(investment,'Нет инвестиционных решений Беларуси');
   investment.value='2';investment.dispatchEvent(new Event('change',{bubbles:true}));
   d.querySelector('[data-party-tab="RUS"]').click();
   d.querySelector('[data-party-tab="BLR"]').click();
   expect(d.querySelector('select[data-party-country="BLR"][data-party-action="1"]').value==='2','Решение исчезло при переключении вкладок');
   const year=d.getElementById('partyYear');
   year.value='2026';year.dispatchEvent(new Event('change',{bubbles:true}));
   recorded=JSON.parse(w.localStorage.getItem('evrasia2050:party-draft:v1'));
   expect(recorded.years['2025'].BLR[1]===2,'Изменение Беларуси потеряно при смене года');
   d.getElementById('partyYear').value='2025';
   d.getElementById('partyYear').dispatchEvent(new Event('change',{bubbles:true}));
   const edited=d.querySelector('select[data-party-country="BLR"][data-party-action="1"]');
   edited.value='0';edited.dispatchEvent(new Event('change',{bubbles:true}));
   d.getElementById('partyCalculate').click();
   recorded=JSON.parse(w.localStorage.getItem('evrasia2050:party-draft:v1'));
   expect(recorded.years['2025'].BLR[1]===0,'Расчет не сохранил последнее изменение Беларуси');
   const result=d.getElementById('partyResultsContent');
   expect(!result.hidden,'Результаты скрыты: '+d.getElementById('partyResultsStatus').textContent);
   expect(d.querySelectorAll('#partyResultRows tr').length===21,'Утрачен показатель сравнения');
   expect(d.querySelectorAll('#partyCountryRows tr').length===8,'Утрачен результат страны');
   expect(d.querySelectorAll('#partySeriesChoices button').length===5,'Нет выбора серий');
   expect(d.querySelectorAll('#partyResultChart polyline').length===2,'На графике неверное число исходных линий');
   const series=[...d.querySelectorAll('#partySeriesChoices button')].find(x=>x.getAttribute('aria-pressed')==='false');
   expect(series,'Нет выключенной серии');series.click();
   expect(d.querySelectorAll('#partyResultChart polyline').length===3,'Линия не добавилась');
   expect(d.documentElement.scrollWidth<=d.documentElement.clientWidth+4,'Горизонтальная прокрутка при ширине 1200');
   const persisted=recorded.years['2025'].BLR.slice();
   const box=[...d.querySelectorAll('#partyCountries input')].find(x=>x.value==='BLR');
   box.click();
   expect(!d.querySelector('[data-party-tab="BLR"]'),'Не исчезла вкладка исключенной страны');
   d.getElementById('partyCalculate').click();
   recorded=JSON.parse(w.localStorage.getItem('evrasia2050:party-draft:v1'));
   expect(JSON.stringify(recorded.years['2025'].BLR)===JSON.stringify(persisted),'Удалились сохраненные решения исключенной страны');
   const scen=w.EURASIA_DATA.scenarios.find(x=>x.scenario_id===recorded.scenario);
   const settings={bootstrap:w.EURASIA_ENGINE_BOOTSTRAP,cat:w.EURASIA_GUIDE.crisisCatalog,scenario:scen,seed:recorded.seed,db:w.EURASIA_DATA,policy:recorded.policy};
   const expected=w.EurasiaEngine.summary(w.EurasiaEngine.run({...settings,overrides:Object.fromEntries(Object.entries(recorded.years).map(([y,rows])=>[y,Object.fromEntries(Object.entries(rows).filter(([country])=>recorded.controlled.includes(country)))]))}));
   const shown=parseFloat(d.querySelector('#partyResultRows tr td').textContent.replace(',','.'));
   expect(Math.abs(shown-expected.growth)<0.006,'Исключенная страна продолжает влиять на экономический расчет');
   frame.style.width='390px';
   expect(d.documentElement.scrollWidth<=d.documentElement.clientWidth+4,'Горизонтальная прокрутка на телефоне (390)');
   frame.style.width='320px';
   const tooWide=[...d.querySelectorAll('body *')].filter(el=>{
    const rect=el.getBoundingClientRect();
    return rect.width>0&&rect.right>d.documentElement.clientWidth+4&&!el.closest('[hidden]');
   }).slice(0,12).map(el=>{
    const r=el.getBoundingClientRect(),parent=el.parentElement;
    return el.tagName.toLowerCase()+'#'+el.id+'.'+String(el.className?.baseVal||el.className||'').slice(0,45)+'('+String(parent?.className||'').slice(0,20)+'):'+
     Math.round(r.left)+'-'+Math.round(r.right);
   }).join('; ');
   expect(d.documentElement.scrollWidth<=d.documentElement.clientWidth+4,
    'Горизонтальная прокрутка на телефоне (320), ширина '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth+'; элементы: '+tooWide);
   status.textContent='PASS UX: изменения без потерь, две страны, расчет, исключенные страны, 21 показатель, 8 стран, график, телефоны';
  }catch(e){status.textContent='FAIL UX: '+e.message;}
 };
 frame.addEventListener('load',()=>setTimeout(verify,250));
 setTimeout(()=>{if(status.textContent==='ОЖИДАНИЕ')status.textContent='FAIL UX: превышено время загрузки';},9000);
})();
</script>
</body></html>
