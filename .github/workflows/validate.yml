name: Проверка игры Евразия 2050
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v4
      - name: Проверить JavaScript
        run: |
          node --check assets/engine_v47.js
          node --check assets/party_results.js
          node --check assets/party_ui.js
          node --check assets/text_editor.js
      - name: Проверить научные и игровые данные
        run: |
          node tests/verify_data.cjs
          node tests/verify_scenarios.cjs
          node tests/verify_party.cjs
          node tests/verify_interface.cjs
          node tests/verify_engine.cjs
          node tests/verify_ux.cjs
      - name: Проверить игровую партию в Chrome
        run: |
          command -v google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/eurasia-test-server.log 2>&1 &
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/tests/browser_smoke.html > /tmp/eurasia-browser-test.html 2>/tmp/eurasia-chrome.log
          grep -o '<p id="status">[^<]*' /tmp/eurasia-browser-test.html || true
          grep -Fq '<p id="status">PASS UX:' /tmp/eurasia-browser-test.html || { tail -c 1800 /tmp/eurasia-browser-test.html; cat /tmp/eurasia-chrome.log | tail -n 25; exit 1; }
          echo "Браузерная игра: тест пройден"
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/tests/editor_smoke.html > /tmp/eurasia-editor-test.html 2>/tmp/eurasia-editor-chrome.log
          grep -o '<p id="status">[^<]*' /tmp/eurasia-editor-test.html || true
          grep -Fq '<p id="status">PASS EDITOR:' /tmp/eurasia-editor-test.html || { tail -c 1800 /tmp/eurasia-editor-test.html; cat /tmp/eurasia-editor-chrome.log | tail -n 25; exit 1; }
          echo "Редактор и публикация текстов в игре: тест пройден"

      - name: Проверить опубликованный адрес /play_the_game
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          URL=https://antondozhdikov.github.io/Evrasia2050_game/play_the_game
          curl -fLsS --retry 4 --retry-delay 3 "$URL" > /tmp/eurasia-public-game.html
          grep -Fq 'id="party-planner"' /tmp/eurasia-public-game.html
          grep -Fq 'assets/engine_v47.js' /tmp/eurasia-public-game.html
          curl -fLsS --retry 4 --retry-delay 3 https://antondozhdikov.github.io/Evrasia2050_game/ > /tmp/eurasia-old-entry.html
          grep -Fq "new URL('./play_the_game'" /tmp/eurasia-old-entry.html
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$URL" > /tmp/eurasia-public-dom.html 2>/tmp/eurasia-public-browser.log
          grep -Fq 'data-party-tab="RUS"' /tmp/eurasia-public-dom.html || { tail -c 1200 /tmp/eurasia-public-dom.html; tail -n 20 /tmp/eurasia-public-browser.log; exit 1; }
          echo "PASS: новый адрес открывает игру, старый адрес перенаправляет, интерфейс работает"
