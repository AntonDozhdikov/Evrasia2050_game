name: Проверка игры Евразия 2050
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v4
      - name: Проверить JavaScript
        run: |
          node --check assets/engine_v47.js
          node --check assets/party_results.js
          node --check assets/party_ui.js
          node --check assets/text_editor.js
      - name: Проверить научные и игровые данные
        run: |
          node tests/verify_data.cjs
          node tests/verify_scenarios.cjs
          node tests/verify_party.cjs
          node tests/verify_interface.cjs
          node tests/verify_engine.cjs
          node tests/verify_ux.cjs
      - name: Проверить игровую партию в Chrome
        run: |
          command -v google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/eurasia-test-server.log 2>&1 &
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/tests/browser_smoke.html > /tmp/eurasia-browser-test.html 2>/tmp/eurasia-chrome.log
          grep -q 'PASS UX:' /tmp/eurasia-browser-test.html || { tail -c 1800 /tmp/eurasia-browser-test.html; cat /tmp/eurasia-chrome.log | tail -n 25; exit 1; }
          echo "Браузерная игра: тест пройден"
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/tests/editor_smoke.html > /tmp/eurasia-editor-test.html 2>/tmp/eurasia-editor-chrome.log
          grep -q 'PASS EDITOR:' /tmp/eurasia-editor-test.html || { tail -c 1800 /tmp/eurasia-editor-test.html; cat /tmp/eurasia-editor-chrome.log | tail -n 25; exit 1; }
          echo "Редактор и публикация текстов в игре: тест пройден"
